<div class="admin-layout">
  <header class="admin-header">
    <div class="header-content">
      <h1 class="header-title">Training Center - Admin</h1>
      <div class="header-actions">
        <span class="user-name">{{ authService.currentUserValue?.name }}</span>
        <button class="logout-btn" (click)="logout()">
          <span class="logout-icon">⎋</span>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <main class="form-content">
    <div class="page-header">
      <div>
        <h2 class="page-title">{{ isEditMode ? 'Edit Course' : 'Create Course' }}</h2>
        <p class="page-subtitle">{{ isEditMode ? 'Update course information' : 'Add a new course to your training center' }}</p>
      </div>
      <button class="btn-back" (click)="cancel()">
        ← Back to Courses
      </button>
    </div>

    <div class="form-container">
      <form (ngSubmit)="onSubmit()" #courseForm="ngForm">
        <div class="form-group">
          <label for="title">Course Title <span class="required">*</span></label>
          <input
            type="text"
            id="title"
            name="title"
            [(ngModel)]="course.title"
            required
            class="form-control"
            placeholder="Enter course title"
          />
        </div>

        <div class="form-group">
          <label for="description">Description <span class="required">*</span></label>
          <textarea
            id="description"
            name="description"
            [(ngModel)]="course.description"
            required
            rows="5"
            class="form-control"
            placeholder="Enter course description"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="is_active">Status</label>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input
                type="checkbox"
                id="is_active"
                name="is_active"
                [(ngModel)]="course.is_active"
              />
              <span>Active (visible to learners)</span>
            </label>
          </div>
        </div>

        <div class="alert alert-error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="alert alert-success" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="submitting">
            Cancel
          </button>
          <button type="submit" class="btn-primary" [disabled]="!courseForm.valid || submitting">
            {{ submitting ? 'Saving...' : (isEditMode ? 'Update Course' : 'Create Course') }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
